- id: angular-pr-growth
  prompt: Our Angular initial bundle grew after this PR. Diagnose the new bytes.
  should_trigger: true
- id: reduce-initial-js
  prompt: Pls cut this Angular app's intial JS by about 100 KB.
  should_trigger: true
- id: nx-exceljs-owner
  prompt: Which Nx app is pulling exceljs into its bundle?
  should_trigger: true
- id: pdfjs-main-trace
  prompt: hey why is pdfjs-dist in main for this Angular build?
  should_trigger: true
- id: compare-refactor-baseline
  prompt: Compare the current Angular refactor with our saved bundle baseline.
  should_trigger: true
- id: regression-gate
  prompt: Add a CI gate that rejects Angular bundle regressions.
  should_trigger: true
- id: largest-lazy-chunks
  prompt: Identify the largest lazy JavaScript chunks in these Angular esbuild stats.
  should_trigger: true
- id: trace-angular-source
  prompt: Trace src/app/report.ts into the emitted Angular chunk that contains it.
  should_trigger: true
