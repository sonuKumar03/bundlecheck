name: 'BundleCheck - Angular Bundle Analyzer & PR Reporter'
description: 'Analyze Angular bundle sizes, estimate Gzip wire transfers, generate PR reports, and enforce size budgets in CI.'
author: 'Sonu Kumar'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  working-directory:
    description: 'Working directory to run bundlecheck in'
    required: false
    default: '.'
  stats:
    description: 'Path to Angular stats.json (auto-detected if omitted)'
    required: false
    default: ''
  dist:
    description: 'Path to emitted browser dist with index.html (auto-detected if omitted)'
    required: false
    default: ''
  project:
    description: 'Project name for multi-project workspaces when auto-detecting'
    required: false
    default: ''
  entry:
    description: 'Scope bundlecheck analysis and budget enforcement to a specific entrypoint (e.g. src/main.ts)'
    required: false
    default: ''
  format:
    description: 'Report format: markdown, json, or text'
    required: false
    default: 'markdown'
  output:
    description: 'File path to write report output (e.g. pr-comment.md)'
    required: false
    default: 'bundle-report.md'
  json-output:
    description: 'Optional file path to write full JSON audit report'
    required: false
    default: ''
  gzip:
    description: 'Include Gzip wire transfer estimation'
    required: false
    default: 'true'
  suggest:
    description: 'Include automated optimization suggestions'
    required: false
    default: 'true'
  max-initial:
    description: 'Maximum allowed initial JS size (e.g. 250KB, 1MB)'
    required: false
    default: ''
  max-lazy:
    description: 'Maximum allowed lazy JS size (e.g. 500KB)'
    required: false
    default: ''
  max-total:
    description: 'Maximum allowed total JS size (e.g. 1.5MB)'
    required: false
    default: ''
  baseline:
    description: 'Path to baseline summary JSON for regression checks'
    required: false
    default: ''
  base-ref:
    description: 'Git base ref (e.g. main, master, or github.base_ref) for automatic worktree comparison'
    required: false
    default: ''
  build-cmd:
    description: 'Build command to run when building base-ref in worktree (defaults to "npm run build")'
    required: false
    default: ''
  max-initial-delta:
    description: 'Maximum allowed increase in initial JS vs baseline (e.g. 0B, 10KB)'
    required: false
    default: ''
  max-total-delta:
    description: 'Maximum allowed increase in total JS vs baseline'
    required: false
    default: ''
  post-comment:
    description: 'Automatically post or update PR summary comment'
    required: false
    default: 'false'

outputs:
  initial-bytes:
    description: 'Initial bundle size in raw bytes'
    value: ${{ steps.run-bundlecheck.outputs.initial_bytes }}
  lazy-bytes:
    description: 'Lazy chunks size in raw bytes'
    value: ${{ steps.run-bundlecheck.outputs.lazy_bytes }}
  total-bytes:
    description: 'Total JavaScript size in raw bytes'
    value: ${{ steps.run-bundlecheck.outputs.total_bytes }}
  report-path:
    description: 'Path where the bundle report was written'
    value: ${{ inputs.output }}
  comparison-status:
    description: 'Comparison status: completed or unavailable'
    value: ${{ steps.run-bundlecheck.outputs.comparison_status }}
  comparison-message:
    description: 'Detailed explanation of comparison status'
    value: ${{ steps.run-bundlecheck.outputs.comparison_message }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: Build & Install bundlecheck
      shell: bash
      run: |
        if ! command -v bundlecheck >/dev/null 2>&1; then
          if [ -f "${{ github.action_path }}/main.go" ]; then
            echo "Building bundlecheck from local action path: ${{ github.action_path }}"
            cd "${{ github.action_path }}" && (go build -o /usr/local/bin/bundlecheck . 2>/dev/null || (mkdir -p "$HOME/.local/bin" && go build -o "$HOME/.local/bin/bundlecheck" . && echo "$HOME/.local/bin" >> $GITHUB_PATH))
          else
            echo "Installing precompiled bundlecheck binary..."
            curl -fsSL https://raw.githubusercontent.com/sonuKumar03/bundlecheck/master/install.sh | sh
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            echo "/usr/local/bin" >> $GITHUB_PATH
          fi
        fi

    - name: Run bundlecheck Analysis & Budgets
      id: run-bundlecheck
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_STATS: ${{ inputs.stats }}
        INPUT_DIST: ${{ inputs.dist }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_ENTRY: ${{ inputs.entry }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_BUILD_CMD: ${{ inputs.build-cmd }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_GZIP: ${{ inputs.gzip }}
        INPUT_SUGGEST: ${{ inputs.suggest }}
        INPUT_MAX_INITIAL: ${{ inputs.max-initial }}
        INPUT_MAX_LAZY: ${{ inputs.max-lazy }}
        INPUT_MAX_TOTAL: ${{ inputs.max-total }}
        INPUT_MAX_INITIAL_DELTA: ${{ inputs.max-initial-delta }}
        INPUT_MAX_TOTAL_DELTA: ${{ inputs.max-total-delta }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_BASE_REF: ${{ github.base_ref }}
      run: |
        set -eo pipefail

        ARGS=()
        if [ -n "$INPUT_STATS" ]; then ARGS+=("-s" "$INPUT_STATS"); fi
        if [ -n "$INPUT_DIST" ]; then ARGS+=("-d" "$INPUT_DIST"); fi
        if [ -n "$INPUT_PROJECT" ]; then ARGS+=("-p" "$INPUT_PROJECT"); fi
        if [ -n "$INPUT_ENTRY" ]; then ARGS+=("--entry" "$INPUT_ENTRY"); fi

        BASELINE_FILE="$INPUT_BASELINE"
        COMPARISON_STATUS="unavailable"
        COMPARISON_MESSAGE="No baseline file or pull request base ref available"

        # Determine target base ref
        TARGET_BASE_REF="$INPUT_BASE_REF"
        if [ -z "$TARGET_BASE_REF" ] && [ -z "$BASELINE_FILE" ] && [ "$EVENT_NAME" = "pull_request" ]; then
          TARGET_BASE_REF="$EVENT_BASE_REF"
        fi

        HAS_DELTA_BUDGET=false
        if [ -n "$INPUT_MAX_INITIAL_DELTA" ] || [ -n "$INPUT_MAX_TOTAL_DELTA" ]; then
          HAS_DELTA_BUDGET=true
        fi

        if [ -n "$TARGET_BASE_REF" ] && [ -z "$BASELINE_FILE" ]; then
          echo "Preparing base git ref: $TARGET_BASE_REF..."
          # Ensure base ref is fetched even in shallow checkouts
          if ! git rev-parse --verify "$TARGET_BASE_REF" >/dev/null 2>&1 && ! git rev-parse --verify "origin/$TARGET_BASE_REF" >/dev/null 2>&1; then
            echo "Fetching origin $TARGET_BASE_REF..."
            git fetch --no-tags --depth=1 origin "$TARGET_BASE_REF" 2>/dev/null || git fetch --no-tags origin "$TARGET_BASE_REF" 2>/dev/null || true
          fi

          if ! git rev-parse --verify "$TARGET_BASE_REF" >/dev/null 2>&1 && git rev-parse --verify "origin/$TARGET_BASE_REF" >/dev/null 2>&1; then
            TARGET_BASE_REF="origin/$TARGET_BASE_REF"
          fi

          RESOLVED_BASE_SHA=$(git rev-parse --short "$TARGET_BASE_REF" 2>/dev/null || true)
          if [ -n "$RESOLVED_BASE_SHA" ]; then
            echo "Comparing against base git ref: $TARGET_BASE_REF ($RESOLVED_BASE_SHA)..."
          else
            echo "Comparing against base git ref: $TARGET_BASE_REF..."
          fi

          WT_BASE_FILE=".bundlecheck/baseline-${TARGET_BASE_REF//\//-}.json"
          SAVE_CMD=("bundlecheck" "baseline" "save" "--ref" "$TARGET_BASE_REF" "-o" "$WT_BASE_FILE")
          if [ -n "$INPUT_BUILD_CMD" ]; then
            SAVE_CMD+=("--build-cmd" "$INPUT_BUILD_CMD")
          fi
          SAVE_CMD+=("${ARGS[@]}")

          if "${SAVE_CMD[@]}"; then
            BASELINE_FILE="$WT_BASE_FILE"
            COMPARISON_STATUS="completed"
            COMPARISON_MESSAGE="Successfully captured and compared against base git ref '$TARGET_BASE_REF'"
            echo "  ✓ Successfully captured base snapshot for $TARGET_BASE_REF"
          else
            COMPARISON_STATUS="unavailable"
            COMPARISON_MESSAGE="Failed to build or analyze base git ref '$TARGET_BASE_REF'"
            if [ "$HAS_DELTA_BUDGET" = "true" ] || [ -n "$INPUT_BASE_REF" ]; then
              echo "::error::$COMPARISON_MESSAGE, and delta budget or explicit base-ref was requested."
              exit 1
            else
              echo "::warning::$COMPARISON_MESSAGE. Proceeding with current build summary."
            fi
          fi
        elif [ -n "$BASELINE_FILE" ] && [ -f "$BASELINE_FILE" ]; then
          COMPARISON_STATUS="completed"
          COMPARISON_MESSAGE="Successfully compared against baseline file '$BASELINE_FILE'"
        fi

        echo "comparison_status=$COMPARISON_STATUS" >> $GITHUB_OUTPUT
        echo "comparison_message=$COMPARISON_MESSAGE" >> $GITHUB_OUTPUT

        # Generate report output
        if [ -n "$BASELINE_FILE" ] && [ -f "$BASELINE_FILE" ]; then
          MEASURE_FLAGS=("${ARGS[@]}" "-b" "$BASELINE_FILE" "-f" "$INPUT_FORMAT")
          if [ -n "$INPUT_MAX_INITIAL_DELTA" ]; then MEASURE_FLAGS+=("--max-initial-delta" "$INPUT_MAX_INITIAL_DELTA"); fi
          if [ -n "$INPUT_MAX_TOTAL_DELTA" ]; then MEASURE_FLAGS+=("--max-total-delta" "$INPUT_MAX_TOTAL_DELTA"); fi
          if [ -n "$INPUT_OUTPUT" ]; then MEASURE_FLAGS+=("-o" "$INPUT_OUTPUT"); fi

          set +e
          bundlecheck measure "${MEASURE_FLAGS[@]}"
          MEASURE_EXIT=$?
          set -e

          if [ $MEASURE_EXIT -ne 0 ]; then
            # Verify if report was produced (indicating a budget failure rather than tool crash)
            if [ -n "$INPUT_OUTPUT" ] && [ -f "$INPUT_OUTPUT" ]; then
              echo "BUDGET_FAILED=true" >> "$GITHUB_ENV"
            else
              echo "::error::bundlecheck measure execution or report generation failed (exit code $MEASURE_EXIT)"
              exit $MEASURE_EXIT
            fi
          fi
        else
          SUMMARY_FLAGS=("${ARGS[@]}" "-f" "$INPUT_FORMAT")
          if [ "$INPUT_GZIP" = "true" ]; then SUMMARY_FLAGS+=("--gzip"); fi
          if [ "$INPUT_SUGGEST" = "true" ]; then SUMMARY_FLAGS+=("--suggest"); fi
          if [ -n "$INPUT_OUTPUT" ]; then SUMMARY_FLAGS+=("-o" "$INPUT_OUTPUT"); fi
          bundlecheck summary "${SUMMARY_FLAGS[@]}"
        fi

        # Append to Job Summary if output file exists and GITHUB_STEP_SUMMARY is set
        if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -n "$INPUT_OUTPUT" ] && [ -f "$INPUT_OUTPUT" ]; then
          cat "$INPUT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        fi

        # Extract structured metrics via JSON
        JSON_OUT=$(bundlecheck summary "${ARGS[@]}" -f json)
        if [ -n "$INPUT_JSON_OUTPUT" ]; then
          echo "$JSON_OUT" > "$INPUT_JSON_OUTPUT"
        fi

        # Parse metrics strictly - fail if JSON is malformed or missing required summary fields
        PARSED_METRICS=$(node -e '
          const data = process.argv[1];
          try {
            const parsed = JSON.parse(data);
            if (!parsed.summary || typeof parsed.summary.initialJs !== "number" || typeof parsed.summary.totalJs !== "number") {
              console.error("Missing required summary numbers in JSON output");
              process.exit(1);
            }
            console.log([parsed.summary.initialJs, parsed.summary.lazyJs ?? 0, parsed.summary.totalJs].join(" "));
          } catch (e) {
            console.error("Failed to parse bundlecheck JSON summary:", e.message);
            process.exit(1);
          }
        ' "$JSON_OUT")

        read -r INITIAL LAZY TOTAL <<< "$PARSED_METRICS"

        echo "initial_bytes=$INITIAL" >> $GITHUB_OUTPUT
        echo "lazy_bytes=$LAZY" >> $GITHUB_OUTPUT
        echo "total_bytes=$TOTAL" >> $GITHUB_OUTPUT

        # Enforce budget checks if any threshold is specified
        CHECK_FLAGS=("${ARGS[@]}")
        HAS_BUDGET=false
        if [ -n "$INPUT_MAX_INITIAL" ]; then CHECK_FLAGS+=("--max-initial" "$INPUT_MAX_INITIAL"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_LAZY" ]; then CHECK_FLAGS+=("--max-lazy" "$INPUT_MAX_LAZY"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_TOTAL" ]; then CHECK_FLAGS+=("--max-total" "$INPUT_MAX_TOTAL"); HAS_BUDGET=true; fi
        if [ -n "$BASELINE_FILE" ] && [ -f "$BASELINE_FILE" ]; then CHECK_FLAGS+=("--baseline" "$BASELINE_FILE"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_INITIAL_DELTA" ]; then CHECK_FLAGS+=("--max-initial-delta" "$INPUT_MAX_INITIAL_DELTA"); HAS_BUDGET=true; fi
        if [ -n "$INPUT_MAX_TOTAL_DELTA" ]; then CHECK_FLAGS+=("--max-total-delta" "$INPUT_MAX_TOTAL_DELTA"); HAS_BUDGET=true; fi

        if [ "$HAS_BUDGET" = "true" ]; then
          echo "Enforcing bundle size budgets..."
          if ! bundlecheck check "${CHECK_FLAGS[@]}"; then
            echo "BUDGET_FAILED=true" >> "$GITHUB_ENV"
          fi
        fi

    - name: Post PR Comment
      if: always() && inputs.post-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        OUTPUT_FILE: ${{ inputs.output }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const repoRoot = path.resolve('.');
          const workingDir = process.env.WORKING_DIR || '.';
          const outputFile = process.env.OUTPUT_FILE || 'bundle-report.md';
          const reportPath = path.resolve(workingDir, outputFile);

          // Path traversal safety check: ensure reportPath stays inside workspace
          if (!reportPath.startsWith(repoRoot + path.sep) && reportPath !== repoRoot) {
            core.setFailed(`Security: report path '${reportPath}' is outside repository root '${repoRoot}'`);
            return;
          }

          if (fs.existsSync(reportPath)) {
            const reportContent = fs.readFileSync(reportPath, 'utf8');
            const headerTag = '<!-- bundlecheck-comment -->';
            const fallbackHeaderTag = '<!-- bundlecheck-report -->';
            let body = reportContent;
            if (!body.includes(headerTag) && !body.includes(fallbackHeaderTag)) {
              body = `${headerTag}\n${body}`;
            }

            // Paginate through all comments to avoid duplicate bot comments on long PRs
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            const botComment = comments.find(c => c.body && (c.body.includes(headerTag) || c.body.includes(fallbackHeaderTag)));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
          }

    - name: Finalize Budget Status
      shell: bash
      run: |
        if [ "${BUDGET_FAILED:-false}" = "true" ]; then
          echo "::error::BundleCheck size budget check failed."
          exit 1
        fi
