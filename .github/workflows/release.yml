name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify release version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./npm/bundlecheck/package.json').version")"
          ROOT_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match npm package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match VERSION file $ROOT_VERSION" >&2
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (Race & Count=1)
        run: go test -v -race -count=1 ./...

      - name: Build Binary
        run: go build -o bundlecheck .

      - name: Validate install.sh
        run: sh -n install.sh

      - name: Smoke Test Binary on Fixture
        run: |
          ./bundlecheck summary testdata/minimal
          ./bundlecheck check testdata/minimal --max-initial 5MB

  publish:
    name: Build & Publish Release
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node for NPM Publish
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Build Multi-Arch Binaries
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_DIR="dist-release"
          mkdir -p "$DIST_DIR"

          TARGETS=(
            "darwin/amd64/bundlecheck_${VERSION}_darwin_amd64.tar.gz"
            "darwin/arm64/bundlecheck_${VERSION}_darwin_arm64.tar.gz"
            "linux/amd64/bundlecheck_${VERSION}_linux_amd64.tar.gz"
            "linux/arm64/bundlecheck_${VERSION}_linux_arm64.tar.gz"
            "windows/amd64/bundlecheck_${VERSION}_windows_amd64.zip"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS='/' read -r GOOS GOARCH ARCHIVE_NAME <<< "$TARGET"
            echo "Building $GOOS/$GOARCH -> $ARCHIVE_NAME..."

            TMP_BUILD="build-${GOOS}-${GOARCH}"
            mkdir -p "$TMP_BUILD"

            EXE_NAME="bundlecheck"
            if [ "$GOOS" = "windows" ]; then
              EXE_NAME="bundlecheck.exe"
            fi

            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "${TMP_BUILD}/${EXE_NAME}" .
            cp README.md LICENSE "${TMP_BUILD}/"

            if [ "$GOOS" = "windows" ]; then
              (cd "$TMP_BUILD" && zip -r "../${DIST_DIR}/${ARCHIVE_NAME}" .)
            else
              tar -czvf "${DIST_DIR}/${ARCHIVE_NAME}" -C "$TMP_BUILD" .
            fi

            rm -rf "$TMP_BUILD"
          done

          # Compute SHA256 checksums
          cd "$DIST_DIR"
          sha256sum * > checksums.txt
          cd ..

      - name: Publish to NPM (if NPM_TOKEN configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            cd npm/bundlecheck
            npm publish --access public
          else
            echo "::notice::NPM_TOKEN not set; skipping npm package publication."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
