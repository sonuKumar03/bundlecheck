name: Remote Bundle Audit

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Public Git Repository URL to audit (e.g. https://github.com/user/angular-app)'
        required: true
        type: string
      ref:
        description: 'Git branch, tag, or commit SHA (leave blank for repository default branch)'
        required: false
        default: ''
        type: string
      sub_dir:
        description: 'Subdirectory where Angular project resides (optional, for monorepos)'
        required: false
        default: '.'
        type: string
      build_cmd:
        description: 'Custom build command (e.g. npx nx build shop --configuration production --stats-json)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Audit Remote Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout bundlecheck
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Inputs and Clone Target Repository
        env:
          REPO_URL: ${{ inputs.repo_url }}
          REF: ${{ inputs.ref }}
          SUB_DIR: ${{ inputs.sub_dir }}
        run: |
          set -euo pipefail

          # 1. Validate sub_dir does not traverse outside target-repo
          RESOLVED_SUBDIR="$(python3 -c "
          import os, sys
          base = os.path.abspath('target-repo')
          target = os.path.abspath(os.path.join('target-repo', sys.argv[1]))
          if not (target == base or target.startswith(base + os.sep)):
              print(f'SECURITY ERROR: sub_dir {sys.argv[1]} traverses outside target-repo', file=sys.stderr)
              sys.exit(1)
          print(target)
          " "$SUB_DIR")"
          echo "Target subdir validated: $RESOLVED_SUBDIR"

          # 2. Clone Target Repository
          echo "Cloning $REPO_URL (ref: ${REF:-default})..."
          if [ -z "$REF" ] || [ "$REF" = "HEAD" ]; then
            git clone --depth 1 "$REPO_URL" target-repo
          elif git clone --depth 1 --branch "$REF" "$REPO_URL" target-repo 2>/dev/null; then
            echo "Successfully shallow-cloned branch/tag $REF"
          else
            echo "Falling back to full clone for commit/ref..."
            git clone "$REPO_URL" target-repo
            cd target-repo
            if ! git checkout "$REF"; then
              echo "Error: Requested ref '$REF' could not be checked out." >&2
              exit 1
            fi
            cd ..
          fi

          # 3. Initialize submodules if present and fail if submodule update fails
          if [ -d target-repo ]; then
            cd target-repo
            if [ -f .gitmodules ]; then
              echo "Initializing git submodules..."
              git submodule update --init --recursive
            fi
            cd ..
          fi

      - name: Build Target Project
        env:
          SUB_DIR: ${{ inputs.sub_dir }}
          CUSTOM_CMD: ${{ inputs.build_cmd }}
        run: |
          set -euo pipefail
          cd "target-repo/$SUB_DIR"

          # 1. Ensure dependencies are installed
          if [ ! -d "node_modules" ]; then
            echo "Installing dependencies..."
            npm config set engine-strict false 2>/dev/null || true
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile || pnpm install
            elif [ -f yarn.lock ]; then
              corepack enable
              yarn install || yarn install --immutable 2>/dev/null
            elif [ -f package-lock.json ]; then
              npm ci --engine-strict=false || npm install --engine-strict=false --legacy-peer-deps || npm install
            else
              npm install --engine-strict=false --legacy-peer-deps || npm install
            fi
          fi

          # 2. Execute build command
          if [ -n "$CUSTOM_CMD" ]; then
            echo "Running custom build command via bash..."
            bash -c "$CUSTOM_CMD"
          else
            echo "Auto-detecting build command with --stats-json..."
            if [ -f nx.json ] || npx --no-install nx --version >/dev/null 2>&1; then
              npx nx run-many -t build --configuration production --stats-json || npx nx build --configuration production --stats-json
            elif [ -f pnpm-lock.yaml ]; then
              pnpm ng build --configuration production --stats-json || pnpm run build -- --stats-json
            elif [ -f yarn.lock ]; then
              yarn ng build --configuration production --stats-json || yarn run build -- --stats-json
            else
              npx ng build --configuration production --stats-json || npm run build -- --stats-json
            fi
          fi

      - name: Annotate Remote Target
        env:
          REPO_URL: ${{ inputs.repo_url }}
          REF: ${{ inputs.ref }}
          SUB_DIR: ${{ inputs.sub_dir }}
        run: |
          echo "## 📊 Remote Bundle Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: [\`$REPO_URL\`]($REPO_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: \`${REF:-default}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Subdirectory**: \`$SUB_DIR\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Run BundleCheck Action
        uses: ./
        with:
          working-directory: target-repo/${{ inputs.sub_dir }}
          gzip: 'true'
          suggest: 'true'
          format: 'markdown'
          output: 'bundle-report.md'
          json-output: 'bundlecheck-audit.json'

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundlecheck-audit-result
          path: |
            target-repo/**/bundle-report.md
            target-repo/**/bundlecheck-audit.json
          if-no-files-found: error
