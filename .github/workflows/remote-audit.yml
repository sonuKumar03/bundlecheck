name: Remote Bundle Audit

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Public Git Repository URL to audit (e.g. https://github.com/user/angular-app)'
        required: true
        type: string
      ref:
        description: 'Git branch, tag, or commit SHA (leave blank for repository default branch)'
        required: false
        default: ''
        type: string
      sub_dir:
        description: 'Subdirectory where Angular project resides (optional, for monorepos)'
        required: false
        default: '.'
        type: string
      build_cmd:
        description: 'Custom build command (e.g. npx nx build shop --configuration production --stats-json)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Audit Remote Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout bundlecheck
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone Target Repository
        run: |
          REPO_URL="${{ inputs.repo_url }}"
          REF="${{ inputs.ref }}"
          echo "Cloning $REPO_URL (ref: ${REF:-default})..."
          if [ -z "$REF" ] || [ "$REF" = "HEAD" ]; then
            git clone --depth 1 "$REPO_URL" target-repo
          elif git clone --depth 1 --branch "$REF" "$REPO_URL" target-repo 2>/dev/null; then
            echo "Successfully shallow-cloned branch/tag $REF"
          else
            echo "Falling back to full clone..."
            git clone "$REPO_URL" target-repo
            cd target-repo
            if ! git checkout "$REF" 2>/dev/null; then
              echo "Warning: ref '$REF' not found; using default branch ($(git rev-parse --abbrev-ref HEAD))"
            fi
          fi
          # Initialize submodules if present (e.g. realworld theme assets)
          if [ -d target-repo ]; then
            cd target-repo && git submodule update --init --recursive 2>/dev/null || true
          fi

      - name: Build Target Project
        working-directory: target-repo/${{ inputs.sub_dir }}
        run: |
          # 1. Ensure dependencies are installed
          if [ ! -d "node_modules" ]; then
            echo "Installing dependencies..."
            npm config set engine-strict false 2>/dev/null || true
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile || pnpm install
            elif [ -f yarn.lock ]; then
              corepack enable
              yarn install || yarn install --immutable 2>/dev/null
            elif [ -f package-lock.json ]; then
              npm ci --engine-strict=false || npm install --engine-strict=false --legacy-peer-deps || npm install
            else
              npm install --engine-strict=false --legacy-peer-deps || npm install
            fi
          fi

          # 2. Execute build command
          CUSTOM_CMD="${{ inputs.build_cmd }}"
          if [ -n "$CUSTOM_CMD" ]; then
            echo "Running custom build command: $CUSTOM_CMD"
            eval "$CUSTOM_CMD"
          else
            echo "Auto-detecting build command with --stats-json..."
            if [ -f nx.json ] || npx --no-install nx --version >/dev/null 2>&1; then
              npx nx run-many -t build --configuration production --stats-json || npx nx build --configuration production --stats-json
            elif [ -f pnpm-lock.yaml ]; then
              pnpm ng build --configuration production --stats-json || pnpm run build -- --stats-json
            elif [ -f yarn.lock ]; then
              yarn ng build --configuration production --stats-json || yarn run build -- --stats-json
            else
              npx ng build --configuration production --stats-json || npm run build -- --stats-json
            fi
          fi

      - name: Annotate Remote Target
        run: |
          echo "## 📊 Remote Bundle Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: [\`${{ inputs.repo_url }}\`](${{ inputs.repo_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: \`${{ inputs.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Subdirectory**: \`${{ inputs.sub_dir }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Run BundleCheck Action
        uses: ./
        with:
          working-directory: target-repo/${{ inputs.sub_dir }}
          gzip: 'true'
          suggest: 'true'
          format: 'markdown'
          output: 'bundle-report.md'
          json-output: 'bundlecheck-audit.json'

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundlecheck-audit-result
          path: |
            target-repo/**/bundle-report.md
            target-repo/**/bundlecheck-audit.json
          if-no-files-found: ignore
