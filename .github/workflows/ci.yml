name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        if: runner.os != 'Linux'
        run: go test -v ./...

      - name: Run Tests with Race Detector
        if: runner.os == 'Linux'
        run: go test -v -race -count=1 ./...

      - name: Build Binary
        run: go build -o bundlecheck .

      - name: Validate install.sh
        if: runner.os != 'Windows'
        run: sh -n install.sh

  benchmark:
    name: Continuous Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Microbenchmarks
        run: go test -bench=. -benchmem -run=^# ./... | tee benchmark-output.txt

      - name: Restore previous benchmark data
        uses: actions/cache/restore@v4
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-benchmark-

      - name: Ensure cache directory exists
        run: mkdir -p ./cache

      - name: Build bundlecheck CLI
        run: go build -o bundlecheck .

      - name: Format Human-Readable Benchmark Summary
        run: ./bundlecheck benchmark benchmark-output.txt -f markdown >> $GITHUB_STEP_SUMMARY

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: benchmark-output.txt
          external-data-json-path: ./cache/benchmark-data.json
          fail-on-alert: false
          summary-always: false
          comment-always: false
          comment-on-alert: false

      - name: Save benchmark data
        uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master'
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.sha }}
