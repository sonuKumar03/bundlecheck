name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -o bundlecheck .

      - name: Validate install.sh
        if: runner.os != 'Windows'
        run: sh -n install.sh
